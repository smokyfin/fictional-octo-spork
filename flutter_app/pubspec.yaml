name: ff_vpn
description: "Cross-platform VPN client routing through Tor with a custom VLESS Pluggable Transport."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  http: ^1.2.2
  mobile_scanner: ^5.2.3
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_animate: ^4.5.0
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  installed_apps: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/
