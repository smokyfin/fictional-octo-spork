[package]
name = "ff_vpn_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# `staticlib` for iOS Network Extension, `cdylib` for Android JNI / Flutter FFI.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
once_cell = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }

arti-client = { workspace = true }
tor-rtcompat = { workspace = true }
tor-linkspec = { workspace = true }
tor-geoip = { workspace = true }

hickory-proto = { workspace = true }
hickory-resolver = { workspace = true }

tokio-util = { workspace = true }
socket2 = { workspace = true }

leaf = { workspace = true }

# rustls 0.23 requires explicit installation of a CryptoProvider before any
# TLS handshake. We pull in rustls directly (not via re-export) so we can
# call `install_default()` once at engine start. Default features include
# `ring`, which matches what arti-client / leaf already depend on
# transitively (avoids pulling in a second crypto backend).
rustls = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"
