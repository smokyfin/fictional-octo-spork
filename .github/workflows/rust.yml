name: rust

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: rust

  check:
    name: cargo check / clippy / test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native deps Leaf / hickory / arti pull in indirectly on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo check (workspace)
        working-directory: rust
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy (workspace)
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test (workspace)
        working-directory: rust
        run: cargo test --workspace --locked

  android-cross:
    name: cargo check (Android targets)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake protobuf-compiler

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android-${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: cargo ndk check
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # Map Rust triple → Android ABI for cargo-ndk.
          case "${{ matrix.target }}" in
            aarch64-linux-android)     ABI=arm64-v8a ;;
            armv7-linux-androideabi)   ABI=armeabi-v7a ;;
            x86_64-linux-android)      ABI=x86_64 ;;
          esac
          cargo ndk -t "$ABI" -- check -p ff_vpn_jni --locked

  ios-cross:
    name: cargo check (iOS targets)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ios-${{ matrix.target }}
      - name: cargo check
        working-directory: rust
        run: cargo check -p ff_vpn_core --target ${{ matrix.target }} --locked
